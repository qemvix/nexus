name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, type-check, unit tests and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Publish -Integration
      - name: Formatting and whitespace
        run: dotnet format Nexus.sln --verify-no-changes --no-restore
      - name: Native startup smoke
        shell: pwsh
        run: |
          $folder = Join-Path $PWD artifacts/smoke
          $process = Start-Process artifacts/publish/Nexus.exe -ArgumentList @('--smoke', ('"' + $folder + '"')) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $folder smoke-result.json))) { throw 'Smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: |
            artifacts/release/*
            artifacts/smoke/nexus-dashboard.png
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexus-windows-x64
          path: release
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --draft --title 'Nexus ${{ github.ref_name }}' --notes 'Unsigned Windows preview. See the README feature matrix and release checklist.' $(find release -type f)

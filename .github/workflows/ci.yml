name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*', 'desktop-v*']
    paths-ignore: ['docs/**', 'updates/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, unit and native integration checks
        shell: pwsh
        run: ./scripts/build.ps1 -Publish -Integration
      - name: Formatting and whitespace
        run: dotnet format Nexus.sln --verify-no-changes --no-restore
      - name: Native startup and UI captures
        shell: pwsh
        run: |
          $folder = Join-Path $PWD artifacts/smoke
          $process = Start-Process artifacts/publish/Nexus.exe -ArgumentList @('--smoke', ('"' + $folder + '"')) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $folder smoke-result.json))) { throw 'Smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-x64
          path: |
            artifacts/release/Nexus-Setup.exe
            artifacts/release/Nexus-*-win-x64-portable.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/Nexus-LICENSE.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ui-screenshots
          path: artifacts/smoke/*.png
          retention-days: 14
  stage-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexus-windows-x64
          path: artifacts/release
      - name: Prepare verified release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-metadata
          path: artifacts/release-metadata.json
          if-no-files-found: ignore
          retention-days: 14

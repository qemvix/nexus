name: Relocate Nexus release history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/relocate-release-history.yml']
permissions:
  contents: write
concurrency:
  group: relocate-nexus-releases
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Copy and verify both official releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, tempfile, urllib.request, urllib.parse, urllib.error
          token = os.environ["GH_TOKEN"]
          source_repo = "qemvix/NexusApp"
          target_repo = "qemvix/nexus"
          def api(method, path, data=None):
              payload = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request("https://api.github.com" + path, data=payload, method=method, headers={
                  "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "Nexus-release-migration",
                  "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          commits = {"desktop-v0.2.0": "a7130a4421833fda71f196d0548a206c04e2c7cb",
                     "desktop-v0.2.1": "0e09d369910d952374501bc4b9143568726a589c"}
          report = []
          for tag, commit in commits.items():
              original = api("GET", f"/repos/{source_repo}/releases/tags/{tag}")
              if original["draft"]: raise RuntimeError("Source release must be published")
              expected = {"Nexus-Setup.exe", "Nexus-LICENSE.txt", "SHA256SUMS.txt",
                          "Nexus-" + tag.removeprefix("desktop-v") + "-win-x64-portable.zip"}
              if {a["name"] for a in original["assets"]} != expected: raise RuntimeError("Source asset list changed")
              try:
                  target = api("GET", f"/repos/{target_repo}/releases/tags/{tag}")
              except urllib.error.HTTPError as error:
                  if error.code != 404: raise
                  target = api("POST", f"/repos/{target_repo}/releases", {
                      "tag_name": tag, "target_commitish": commit, "name": original["name"],
                      "body": original["body"], "draft": True, "prerelease": original["prerelease"],
                      "make_latest": "false"})
              with tempfile.TemporaryDirectory(prefix="nexus-release-") as temp:
                  for asset in original["assets"]:
                      digest = asset.get("digest", "")
                      if not digest.startswith("sha256:"): raise RuntimeError("Missing source digest")
                      existing = next((a for a in target["assets"] if a["name"] == asset["name"]), None)
                      if existing:
                          if existing["size"] != asset["size"] or existing.get("digest") != digest:
                              raise RuntimeError("Destination asset differs; refusing to overwrite it")
                          print("Already verified:", tag, asset["name"], flush=True)
                          continue
                      path = pathlib.Path(temp) / asset["name"]
                      hasher = hashlib.sha256()
                      request = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "Nexus-release-migration"})
                      with urllib.request.urlopen(request, timeout=300) as response, path.open("wb") as output:
                          while chunk := response.read(1024 * 1024):
                              output.write(chunk); hasher.update(chunk)
                      if path.stat().st_size != asset["size"] or "sha256:" + hasher.hexdigest() != digest:
                          raise RuntimeError("Downloaded source asset failed verification")
                      upload_url = target["upload_url"].split("{")[0] + "?name=" + urllib.parse.quote(asset["name"])
                      if urllib.parse.urlparse(upload_url).hostname != "uploads.github.com": raise RuntimeError("Unexpected upload host")
                      req = urllib.request.Request(upload_url, data=path.read_bytes(), method="POST", headers={
                          "Authorization": "Bearer " + token, "Content-Type": asset["content_type"] or "application/octet-stream",
                          "Accept": "application/vnd.github+json", "User-Agent": "Nexus-release-migration"})
                      with urllib.request.urlopen(req, timeout=600) as response: uploaded = json.load(response)
                      if uploaded["size"] != asset["size"] or uploaded.get("digest") != digest or uploaded["state"] != "uploaded":
                          raise RuntimeError("Destination upload failed verification")
                      print("Verified:", tag, asset["name"], digest, flush=True)
              target = api("PATCH", f"/repos/{target_repo}/releases/{target['id']}", {
                  "name": original["name"], "body": original["body"], "draft": False,
                  "prerelease": original["prerelease"], "make_latest": "true" if tag == "desktop-v0.2.1" else "false"})
              actual = {a["name"]: (a["size"], a.get("digest")) for a in target["assets"]}
              wanted = {a["name"]: (a["size"], a.get("digest")) for a in original["assets"]}
              if actual != wanted: raise RuntimeError("Final asset set mismatch")
              for asset in target["assets"]:
                  req = urllib.request.Request(asset["browser_download_url"], method="HEAD", headers={"User-Agent":"Nexus-release-migration"})
                  with urllib.request.urlopen(req, timeout=60) as response:
                      if response.status != 200 or int(response.headers["Content-Length"]) != asset["size"]:
                          raise RuntimeError("Public download check failed")
              report.append({"tag":tag, "id":target["id"], "url":target["html_url"], "assets":actual})
              print("PUBLISHED AND PUBLICLY VERIFIED:", target["html_url"], flush=True)
          pathlib.Path("migration-report.json").write_text(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Both Nexus releases copied with identical asset sizes and SHA-256 digests. Public downloads verified. Source releases have not been deleted.\n")
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-migration-report
          path: migration-report.json
          retention-days: 14
